[project]
name = "arbitros"
version = "0.4.0"
description = "Gestión de árbitros de fútbol: disponibilidad, jornadas, roles, cédulas y pagos."
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "bcrypt>=4.1,<6",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arbitros = "arbitros.main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbitros = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
